name: official SWE-bench smoke
on:
  push:
    paths:
      - 'experiments/official*'
      - 'scripts/official_smoke_grade.py'
      - 'examples/official-smoke/**'
      - '.github/workflows/official-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: official-smoke-${{ github.ref }}
  cancel-in-progress: false
jobs:
  official-grading:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check for real predictions and hash-bound attempts
        id: inputs
        run: python scripts/official_smoke_grade.py --check-inputs
      - name: Install core, Parquet reader and exact official harness
        if: steps.inputs.outputs.ready == 'true'
        run: >-
          python -m pip install -e . pyarrow
          "swebench @ git+https://github.com/SWE-bench/SWE-bench.git@02e7a74ffd0b707aab73d203fe87bdc7c76afc8e"
      - name: Grade pinned official tasks sequentially
        if: steps.inputs.outputs.ready == 'true'
        run: python scripts/official_smoke_grade.py
      - name: Publish only safe grading evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runs/official-smoke/summary.json
            runs/official-smoke/pipeline-error.json
            runs/official-smoke/events.jsonl
            runs/official-smoke/reports/**/*.json
            runs/official-smoke/reports/**/patch.diff
          if-no-files-found: warn
          retention-days: 30
