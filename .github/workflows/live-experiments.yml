name: live-model-experiments
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/live-experiments.yml'
      - 'scripts/ci_live_experiment.py'
      - 'scripts/run_experiments.py'
      - 'scripts/merge_live_experiments.py'
      - 'scripts/build_official_predictions.py'
      - 'examples/more-itertools-count-runs.json'
      - 'examples/official-smoke/*.json'
permissions:
  contents: read
concurrency:
  group: live-model-experiments-${{ github.ref }}
  cancel-in-progress: false
jobs:
  inference:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - id: count-runs-baseline
            task: examples/more-itertools-count-runs.json
            profile: baseline
          - id: count-runs-recent
            task: examples/more-itertools-count-runs.json
            profile: recent
          - id: count-runs-retrieval
            task: examples/more-itertools-count-runs.json
            profile: retrieval
          - id: flask-5014-retrieval
            task: examples/official-smoke/pallets__flask-5014.json
            profile: retrieval
          - id: requests-1142-retrieval
            task: examples/official-smoke/psf__requests-1142.json
            profile: retrieval
          - id: requests-2931-retrieval
            task: examples/official-smoke/psf__requests-2931.json
            profile: retrieval
    env:
      OLLAMA_MODELS: ${{ runner.temp }}/ollama-models
      OLLAMA_NO_CLOUD: '1'
      NO_PROXY: 127.0.0.1,localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[agent]"
      - name: Install the verified fixed Ollama release locally
        shell: bash
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/ollama-v0.40.2.tar.zst"
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 600 \
            https://github.com/ollama/ollama/releases/download/v0.40.2/ollama-linux-amd64.tar.zst \
            --output "$package"
          printf '%s  %s\n' 726bee78706c281b0eeef00746efe51a044d71c592c3f0b195820707f31fdf04 "$package" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/ollama-pin"
          tar --zstd -xf "$package" -C "$RUNNER_TEMP/ollama-pin"
      - name: Execute one real model attempt
        run: >-
          python scripts/ci_live_experiment.py
          --ollama "${{ runner.temp }}/ollama-pin/bin/ollama"
          --task "${{ matrix.task }}" --profile "${{ matrix.profile }}"
          --output runs/live-ci --evidence runs/public-experiments
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-model-shard-${{ matrix.id }}
          path: runs/public-experiments/
          if-no-files-found: error
          retention-days: 14
  collect-and-verify:
    needs: inference
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: live-model-shard-*
          path: collector/shards
      - name: Collect every attempt without raw trajectories
        run: >-
          python scripts/merge_live_experiments.py --shards collector/shards
          --output collector/public-experiments --expected-runs 6
      - name: Build predictions for the official three-task harness
        run: >-
          python scripts/build_official_predictions.py
          --manifest collector/public-experiments/repository-ablation.json
          --source examples/official-smoke/source.json
          --output collector/public-experiments/official-predictions.jsonl
          --model-id repo-delivery-qwen2_5-coder-1_5b
      - name: Verify public repository patches in independent Docker environments
        run: >-
          python scripts/grade_experiments.py
          --manifest collector/public-experiments/repository-ablation.json
          --output collector/public-experiments/repository-verification.json
          --pull-images
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-experiment-evidence
          path: collector/public-experiments/
          if-no-files-found: error
          retention-days: 30
