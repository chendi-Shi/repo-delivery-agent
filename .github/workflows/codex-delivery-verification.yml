name: independent verification of Codex model patches
on:
  push:
    branches: [main]
    paths: ['experiments/codex-cli-proof-v*/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codex-public-verification-${{ github.sha }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        round: [codex-cli-proof-v1, codex-cli-proof-v2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reapply the real saved patch and execute frozen public checks
        run: >-
          python scripts/grade_experiments.py
          --manifest experiments/${{ matrix.round }}/repository-ablation.json
          --output runs/${{ matrix.round }}-verification.json --pull-images
      - name: Retain independent outcomes including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.round }}-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: runs/${{ matrix.round }}-verification.json
          if-no-files-found: error
          retention-days: 30
