name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[agent]"
      - run: python -m unittest discover -s tests -v
  docker-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[agent]"
      - run: docker pull python:3.12-slim
      - run: python scripts/docker_smoke.py --output runs/docker-validation.json
      - run: python scripts/docker_recovery_smoke.py --output runs/docker-recovery.json
      - uses: actions/upload-artifact@v4
        with:
          name: docker-integration-evidence
          path: |
            runs/docker-validation.json
            runs/docker-recovery.json
  real-model-patch-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
        if: ${{ hashFiles('experiments/repository-ablation.json') != '' }}
      - run: python scripts/grade_experiments.py --pull-images --output runs/repository-verification.json
        if: ${{ hashFiles('experiments/repository-ablation.json') != '' }}
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('experiments/repository-ablation.json') != '' }}
        with:
          name: real-model-public-check-verification
          path: runs/repository-verification.json
